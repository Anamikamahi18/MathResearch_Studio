name: parser-tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --upgrade pip pypdf

      - name: Run parser unit tests
        run: python -m unittest tests.test_section_detector tests.test_json_export tests.test_reliability -v
