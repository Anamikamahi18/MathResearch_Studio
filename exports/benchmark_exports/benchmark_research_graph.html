ng Theorems\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Chromatic Polynomials and Planar Graph Colorability\u003cbr\u003e\u003chr\u003e\u003ccode\u003eof Theorem 3.1. Using Definition 1.1 and Lemma 2.1, we perform induction on the number of vertices.\u003c/code\u003e"}, {"color": "#2ca02c", "font": {"color": "#000000"}, "id": "paper_bm01_graph_theory_corollary_cor_002", "label": "Corollary 3.2.", "shape": "box", "size": 22, "title": "\u003cb\u003eCorollary 3.2.\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Corollary\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 2. Coloring Theorems\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Chromatic Polynomials and Planar Graph Colorability\u003cbr\u003e\u003chr\u003e\u003ccode\u003eBy Theorem 3.1, planar graphs have chromatic number chi(G) \u0026lt;= 5.\u003c/code\u003e"}, {"color": "#aec7e8", "font": {"color": "#000000"}, "id": "paper_paper_bm01_graph_theory", "label": "paper_paper_bm01_graph_theory", "shape": "ellipse", "size": 15, "title": "\u003cb\u003epaper_paper_bm01_graph_theory\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Stub\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Chromatic Polynomials and Planar Graph Colorability\u003cbr\u003e"}, {"color": "#c7c7c7", "font": {"color": "#000000"}, "id": "paper_bm01_graph_theory_ref_001", "label": "paper_bm01_graph_theory_ref_001", "shape": "dot", "size": 15, "title": "\u003cb\u003epaper_bm01_graph_theory_ref_001\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Reference\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Chromatic Polynomials and Planar Graph Colorability\u003cbr\u003e"}, {"color": "#1f77b4", "font": {"color": "#000000"}, "id": "paper_bm02_linear_algebra_definition_def_001", "label": "Definition 1.2", "shape": "box", "size": 25, "title": "\u003cb\u003eDefinition 1.2\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Definition\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 1. Vector Spaces and Operators\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Spectral Decomposition of Normal and Hermitian Operators\u003cbr\u003e\u003chr\u003e\u003ccode\u003eAn n x n matrix A is Hermitian if A^* = A.\u003c/code\u003e"}, {"color": "#d62728", "font": {"color": "#000000"}, "id": "paper_bm02_linear_algebra_theorem_thm_001", "label": "Theorem 4.1", "shape": "ellipse", "size": 30, "title": "\u003cb\u003eTheorem 4.1\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Theorem\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 2. Spectral Theorems\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Spectral Decomposition of Normal and Hermitian Operators\u003cbr\u003e\u003chr\u003e\u003ccode\u003eTheorem 4.1 follows from Lemma 2.2. Every Hermitian matrix A is unitarily diagonalizable.\u003c/code\u003e"}, {"color": "#ff7f0e", "font": {"color": "#000000"}, "id": "paper_bm02_linear_algebra_lemma_lem_001", "label": "Lemma 2.2", "shape": "diamond", "size": 25, "title": "\u003cb\u003eLemma 2.2\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Lemma\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 2. Spectral Theorems\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Spectral Decomposition of Normal and Hermitian Operators\u003cbr\u003e\u003chr\u003e\u003ccode\u003eEigenvectors corresponding to distinct eigenvalues of a Hermitian matrix are orthogonal.\u003c/code\u003e"}, {"color": "#9467bd", "font": {"color": "#000000"}, "id": "paper_bm02_linear_algebra_proof_prf_001", "label": "Proof of Theorem 4.1", "shape": "square", "size": 20, "title": "\u003cb\u003eProof of Theorem 4.1\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Proof\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 2. Spectral Theorems\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Spectral Decomposition of Normal and Hermitian Operators\u003cbr\u003e\u003chr\u003e\u003ccode\u003eApply Definition 1.2 and Lemma 2.2.\u003c/code\u003e"}, {"color": "#1f77b4", "font": {"color": "#000000"}, "id": "paper_bm02_linear_algebra_definition_def_002", "label": "Definition 1.2.", "shape": "box", "size": 25, "title": "\u003cb\u003eDefinition 1.2.\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Definition\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 1. Vector Spaces and Operators\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Spectral Decomposition of Normal and Hermitian Operators\u003cbr\u003e\u003chr\u003e\u003ccode\u003eAn n x n matrix A is Hermitian if A^* = A.\u003c/code\u003e"}, {"color": "#7f7f7f", "font": {"color": "#000000"}, "id": "paper_bm02_linear_algebra_remark_rmk_001", "label": "Remark 2.", "shape": "triangle", "size": 18, "title": "\u003cb\u003eRemark 2.\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Remark\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 1. Vector Spaces and Operators\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Spectral Decomposition of Normal and Hermitian Operators\u003cbr\u003e\u003chr\u003e\u003ccode\u003eHermitian matrices have real eigenvalues.\u003c/code\u003e"}, {"color": "#ff7f0e", "font": {"color": "#000000"}, "id": "paper_bm02_linear_algebra_lemma_lem_002", "label": "Lemma 2.2.", "shape": "diamond", "size": 25, "title": "\u003cb\u003eLemma 2.2.\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Lemma\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 2. Spectral Theorems\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Spectral Decomposition of Normal and Hermitian Operators\u003cbr\u003e\u003chr\u003e\u003ccode\u003eEigenvectors corresponding to distinct eigenvalues of a Hermitian matrix are orthogonal.\u003c/code\u003e"}, {"color": "#d62728", "font": {"color": "#000000"}, "id": "paper_bm02_linear_algebra_theorem_thm_002", "label": "Theorem 4.1.", "shape": "ellipse", "size": 30, "title": "\u003cb\u003eTheorem 4.1.\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Theorem\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 2. Spectral Theorems\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Spectral Decomposition of Normal and Hermitian Operators\u003cbr\u003e\u003chr\u003e\u003ccode\u003eTheorem 4.1 follows from Lemma 2.2. Every Hermitian matrix A is unitarily diagonalizable.\u003c/code\u003e"}, {"color": "#9467bd", "font": {"color": "#000000"}, "id": "paper_bm02_linear_algebra_proof_prf_002", "label": "Proof", "shape": "square", "size": 20, "title": "\u003cb\u003eProof\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Proof\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 2. Spectral Theorems\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Spectral Decomposition of Normal and Hermitian Operators\u003cbr\u003e\u003chr\u003e\u003ccode\u003eof Theorem 4.1. Apply Definition 1.2 and Lemma 2.2.\u003c/code\u003e"}, {"color": "#aec7e8", "font": {"color": "#000000"}, "id": "paper_paper_bm02_linear_algebra", "label": "paper_paper_bm02_linear_algebra", "shape": "ellipse", "size": 15, "title": "\u003cb\u003epaper_paper_bm02_linear_algebra\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Stub\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Spectral Decomposition of Normal and Hermitian Operators\u003cbr\u003e"}, {"color": "#c7c7c7", "font": {"color": "#000000"}, "id": "paper_bm02_linear_algebra_ref_001", "label": "paper_bm02_linear_algebra_ref_001", "shape": "dot", "size": 15, "title": "\u003cb\u003epaper_bm02_linear_algebra_ref_001\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Reference\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Spectral Decomposition of Normal and Hermitian Operators\u003cbr\u003e"}, {"color": "#1f77b4", "font": {"color": "#000000"}, "id": "paper_bm03_functional_analysis_definition_def_001", "label": "Definition 1.3", "shape": "box", "size": 25, "title": "\u003cb\u003eDefinition 1.3\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Definition\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 1. Normed Linear Spaces\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Hahn-Banach Extension Theorem and Convex Sets in Banach Spaces\u003cbr\u003e\u003chr\u003e\u003ccode\u003eA Banach space is a complete normed vector space.\u003c/code\u003e"}, {"color": "#d62728", "font": {"color": "#000000"}, "id": "paper_bm03_functional_analysis_theorem_thm_001", "label": "Theorem 5.1", "shape": "ellipse", "size": 30, "title": "\u003cb\u003eTheorem 5.1\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Theorem\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 2. Extension Theorems\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Hahn-Banach Extension Theorem and Convex Sets in Banach Spaces\u003cbr\u003e\u003chr\u003e\u003ccode\u003eTheorem 5.1 follows from Lemma 2.3. Every bounded linear functional f defined on a subspace M of a normed space X can be extended to X preserving the norm.\u003c/code\u003e"}, {"color": "#ff7f0e", "font": {"color": "#000000"}, "id": "paper_bm03_functional_analysis_lemma_lem_001", "label": "Lemma 2.3", "shape": "diamond", "size": 25, "title": "\u003cb\u003eLemma 2.3\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Lemma\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 2. Extension Theorems\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Hahn-Banach Extension Theorem and Convex Sets in Banach Spaces\u003cbr\u003e\u003chr\u003e\u003ccode\u003eSublinear functionals admit 1-dimensional bounded linear extensions.\u003c/code\u003e"}, {"color": "#2ca02c", "font": {"color": "#000000"}, "id": "paper_bm03_functional_analysis_corollary_cor_001", "label": "Corollary 5.2", "shape": "box", "size": 22, "title": "\u003cb\u003eCorollary 5.2\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Corollary\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 2. Extension Theorems\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Hahn-Banach Extension Theorem and Convex Sets in Banach Spaces\u003cbr\u003e\u003chr\u003e\u003ccode\u003eBy Theorem 5.1, the dual space X* separates points of X.\u003c/code\u003e"}, {"color": "#9467bd", "font": {"color": "#000000"}, "id": "paper_bm03_functional_analysis_proof_prf_001", "label": "Proof of Theorem 5.1", "shape": "square", "size": 20, "title": "\u003cb\u003eProof of Theorem 5.1\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Proof\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 2. Extension Theorems\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Hahn-Banach Extension Theorem and Convex Sets in Banach Spaces\u003cbr\u003e\u003chr\u003e\u003ccode\u003eUsing Definition 1.3 and Lemma 2.3, we apply Zorn\u0026#x27;s lemma.\u003c/code\u003e"}, {"color": "#1f77b4", "font": {"color": "#000000"}, "id": "paper_bm03_functional_analysis_definition_def_002", "label": "Definition 1.3.", "shape": "box", "size": 25, "title": "\u003cb\u003eDefinition 1.3.\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Definition\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 1. Normed Linear Spaces\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Hahn-Banach Extension Theorem and Convex Sets in Banach Spaces\u003cbr\u003e\u003chr\u003e\u003ccode\u003eA Banach space is a complete normed vector space.\u003c/code\u003e"}, {"color": "#17becf", "font": {"color": "#000000"}, "id": "paper_bm03_functional_analysis_example_ex_001", "label": "Example 2.", "shape": "hexagon", "size": 20, "title": "\u003cb\u003eExample 2.\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Example\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 1. Normed Linear Spaces\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Hahn-Banach Extension Theorem and Convex Sets in Banach Spaces\u003cbr\u003e\u003chr\u003e\u003ccode\u003eThe space L^p([0,1]) is a Banach space for 1 \u0026lt;= p \u0026lt;= infty.\u003c/code\u003e"}, {"color": "#ff7f0e", "font": {"color": "#000000"}, "id": "paper_bm03_functional_analysis_lemma_lem_002", "label": "Lemma 2.3.", "shape": "diamond", "size": 25, "title": "\u003cb\u003eLemma 2.3.\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Lemma\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 2. Extension Theorems\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Hahn-Banach Extension Theorem and Convex Sets in Banach Spaces\u003cbr\u003e\u003chr\u003e\u003ccode\u003eSublinear functionals admit 1-dimensional bounded linear extensions.\u003c/code\u003e"}, {"color": "#d62728", "font": {"color": "#000000"}, "id": "paper_bm03_functional_analysis_theorem_thm_002", "label": "Theorem 5.1.", "shape": "ellipse", "size": 30, "title": "\u003cb\u003eTheorem 5.1.\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Theorem\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 2. Extension Theorems\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Hahn-Banach Extension Theorem and Convex Sets in Banach Spaces\u003cbr\u003e\u003chr\u003e\u003ccode\u003eTheorem 5.1 follows from Lemma 2.3. Every bounded linear functional f defined on a subspace M of a normed space X can be extended to X preserving the norm.\u003c/code\u003e"}, {"color": "#9467bd", "font": {"color": "#000000"}, "id": "paper_bm03_functional_analysis_proof_prf_002", "label": "Proof", "shape": "square", "size": 20, "title": "\u003cb\u003eProof\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Proof\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 2. Extension Theorems\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Hahn-Banach Extension Theorem and Convex Sets in Banach Spaces\u003cbr\u003e\u003chr\u003e\u003ccode\u003eof Theorem 5.1. Using Definition 1.3 and Lemma 2.3, we apply Zorn\u0026#x27;s lemma.\u003c/code\u003e"}, {"color": "#2ca02c", "font": {"color": "#000000"}, "id": "paper_bm03_functional_analysis_corollary_cor_002", "label": "Corollary 5.2.", "shape": "box", "size": 22, "title": "\u003cb\u003eCorollary 5.2.\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Corollary\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 2. Extension Theorems\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Hahn-Banach Extension Theorem and Convex Sets in Banach Spaces\u003cbr\u003e\u003chr\u003e\u003ccode\u003eBy Theorem 5.1, the dual space X* separates points of X.\u003c/code\u003e"}, {"color": "#aec7e8", "font": {"color": "#000000"}, "id": "paper_paper_bm03_functional_analysis", "label": "paper_paper_bm03_functional_analysis", "shape": "ellipse", "size": 15, "title": "\u003cb\u003epaper_paper_bm03_functional_analysis\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Stub\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Hahn-Banach Extension Theorem and Convex Sets in Banach Spaces\u003cbr\u003e"}, {"color": "#c7c7c7", "font": {"color": "#000000"}, "id": "paper_bm03_functional_analysis_ref_001", "label": "paper_bm03_functional_analysis_ref_001", "shape": "dot", "size": 15, "title": "\u003cb\u003epaper_bm03_functional_analysis_ref_001\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Reference\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Hahn-Banach Extension Theorem and Convex Sets in Banach Spaces\u003cbr\u003e"}, {"color": "#c7c7c7", "font": {"color": "#000000"}, "id": "[0,1]", "label": "[0,1]", "shape": "dot", "size": 15, "title": "\u003cb\u003e[0,1]\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Reference\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Karush-Kuhn-Tucker Conditions and Convex Duality in Non-Linear Programming\u003cbr\u003e"}, {"color": "#1f77b4", "font": {"color": "#000000"}, "id": "paper_bm04_number_theory_definition_def_001", "label": "Definition 1.4", "shape": "box", "size": 25, "title": "\u003cb\u003eDefinition 1.4\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Definition\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 1. Zeta Function Definition\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e On the Distribution of Primes and Zeros of the Riemann Zeta Function\u003cbr\u003e\u003chr\u003e\u003ccode\u003eThe Riemann zeta function zeta(s) is defined for Re(s) \u0026gt; 1 by the Dirichlet series sum n^{-s}.\u003c/code\u003e"}, {"color": "#d62728", "font": {"color": "#000000"}, "id": "paper_bm04_number_theory_theorem_thm_001", "label": "Theorem 6.1", "shape": "ellipse", "size": 30, "title": "\u003cb\u003eTheorem 6.1\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Theorem\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 2. Prime Number Theorem\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e On the Distribution of Primes and Zeros of the Riemann Zeta Function\u003cbr\u003e\u003chr\u003e\u003ccode\u003eTheorem 6.1 follows from Lemma 2.4. The prime counting function pi(x) is asymptotic to x / log(x).\u003c/code\u003e"}, {"color": "#ff7f0e", "font": {"color": "#000000"}, "id": "paper_bm04_number_theory_lemma_lem_001", "label": "Lemma 2.4", "shape": "diamond", "size": 25, "title": "\u003cb\u003eLemma 2.4\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Lemma\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 2. Prime Number Theorem\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e On the Distribution of Primes and Zeros of the Riemann Zeta Function\u003cbr\u003e\u003chr\u003e\u003ccode\u003eThe zeta function zeta(s) has no zeros on the line Re(s) = 1.\u003c/code\u003e"}, {"color": "#9467bd", "font": {"color": "#000000"}, "id": "paper_bm04_number_theory_proof_prf_001", "label": "Proof of Theorem 6.1", "shape": "square", "size": 20, "title": "\u003cb\u003eProof of Theorem 6.1\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Proof\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 2. Prime Number Theorem\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e On the Distribution of Primes and Zeros of the Riemann Zeta Function\u003cbr\u003e\u003chr\u003e\u003ccode\u003eApply Definition 1.4 and Lemma 2.4 using contour integration.\u003c/code\u003e"}, {"color": "#1f77b4", "font": {"color": "#000000"}, "id": "paper_bm04_number_theory_definition_def_002", "label": "Definition 1.4.", "shape": "box", "size": 25, "title": "\u003cb\u003eDefinition 1.4.\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Definition\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 1. Zeta Function Definition\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e On the Distribution of Primes and Zeros of the Riemann Zeta Function\u003cbr\u003e\u003chr\u003e\u003ccode\u003eThe Riemann zeta function zeta(s) is defined for Re(s) \u0026gt; 1 by the Dirichlet series sum n^{-s}.\u003c/code\u003e"}, {"color": "#7f7f7f", "font": {"color": "#000000"}, "id": "paper_bm04_number_theory_remark_rmk_001", "label": "Remark 3.", "shape": "triangle", "size": 18, "title": "\u003cb\u003eRemark 3.\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Remark\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 1. Zeta Function Definition\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e On the Distribution of Primes and Zeros of the Riemann Zeta Function\u003cbr\u003e\u003chr\u003e\u003ccode\u003eThe non-trivial zeros lie in the critical strip 0 \u0026lt;= Re(s) \u0026lt;= 1.\u003c/code\u003e"}, {"color": "#ff7f0e", "font": {"color": "#000000"}, "id": "paper_bm04_number_theory_lemma_lem_002", "label": "Lemma 2.4.", "shape": "diamond", "size": 25, "title": "\u003cb\u003eLemma 2.4.\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Lemma\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 2. Prime Number Theorem\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e On the Distribution of Primes and Zeros of the Riemann Zeta Function\u003cbr\u003e\u003chr\u003e\u003ccode\u003eThe zeta function zeta(s) has no zeros on the line Re(s) = 1.\u003c/code\u003e"}, {"color": "#d62728", "font": {"color": "#000000"}, "id": "paper_bm04_number_theory_theorem_thm_002", "label": "Theorem 6.1.", "shape": "ellipse", "size": 30, "title": "\u003cb\u003eTheorem 6.1.\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Theorem\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 2. Prime Number Theorem\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e On the Distribution of Primes and Zeros of the Riemann Zeta Function\u003cbr\u003e\u003chr\u003e\u003ccode\u003eTheorem 6.1 follows from Lemma 2.4. The prime counting function pi(x) is asymptotic to x / log(x).\u003c/code\u003e"}, {"color": "#9467bd", "font": {"color": "#000000"}, "id": "paper_bm04_number_theory_proof_prf_002", "label": "Proof", "shape": "square", "size": 20, "title": "\u003cb\u003eProof\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Proof\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 2. Prime Number Theorem\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e On the Distribution of Primes and Zeros of the Riemann Zeta Function\u003cbr\u003e\u003chr\u003e\u003ccode\u003eof Theorem 6.1. Apply Definition 1.4 and Lemma 2.4 using contour integration.\u003c/code\u003e"}, {"color": "#aec7e8", "font": {"color": "#000000"}, "id": "paper_paper_bm04_number_theory", "label": "paper_paper_bm04_number_theory", "shape": "ellipse", "size": 15, "title": "\u003cb\u003epaper_paper_bm04_number_theory\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Stub\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e On the Distribution of Primes and Zeros of the Riemann Zeta Function\u003cbr\u003e"}, {"color": "#c7c7c7", "font": {"color": "#000000"}, "id": "paper_bm04_number_theory_ref_001", "label": "paper_bm04_number_theory_ref_001", "shape": "dot", "size": 15, "title": "\u003cb\u003epaper_bm04_number_theory_ref_001\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Reference\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e On the Distribution of Primes and Zeros of the Riemann Zeta Function\u003cbr\u003e"}, {"color": "#1f77b4", "font": {"color": "#000000"}, "id": "paper_bm05_optimization_definition_def_001", "label": "Definition 1.5", "shape": "box", "size": 25, "title": "\u003cb\u003eDefinition 1.5\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Definition\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 1. Convex Functions and Sets\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Karush-Kuhn-Tucker Conditions and Convex Duality in Non-Linear Programming\u003cbr\u003e\u003chr\u003e\u003ccode\u003eA function f: R^n -\u0026gt; R is convex if f(tx + (1-t)y) \u0026lt;= t f(x) + (1-t) f(y) for all t in [0,1].\u003c/code\u003e"}, {"color": "#d62728", "font": {"color": "#000000"}, "id": "paper_bm05_optimization_theorem_thm_001", "label": "Theorem 7.1", "shape": "ellipse", "size": 30, "title": "\u003cb\u003eTheorem 7.1\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Theorem\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 2. Optimality Conditions\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Karush-Kuhn-Tucker Conditions and Convex Duality in Non-Linear Programming\u003cbr\u003e\u003chr\u003e\u003ccode\u003eTheorem 7.1 follows from Lemma 2.5. Under Slater\u0026#x27;s condition, x* is optimal if and only if there exist KKT multipliers satisfying primal and dual feasibility.\u003c/code\u003e"}, {"color": "#ff7f0e", "font": {"color": "#000000"}, "id": "paper_bm05_optimization_lemma_lem_001", "label": "Lemma 2.5", "shape": "diamond", "size": 25, "title": "\u003cb\u003eLemma 2.5\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Lemma\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 2. Optimality Conditions\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Karush-Kuhn-Tucker Conditions and Convex Duality in Non-Linear Programming\u003cbr\u003e\u003chr\u003e\u003ccode\u003eFor convex differentiable f, local minima are global minima.\u003c/code\u003e"}, {"color": "#2ca02c", "font": {"color": "#000000"}, "id": "paper_bm05_optimization_corollary_cor_001", "label": "Corollary 7.2", "shape": "box", "size": 22, "title": "\u003cb\u003eCorollary 7.2\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Corollary\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 2. Optimality Conditions\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Karush-Kuhn-Tucker Conditions and Convex Duality in Non-Linear Programming\u003cbr\u003e\u003chr\u003e\u003ccode\u003eBy Theorem 7.1, strong duality holds for strictly feasible convex problems.\u003c/code\u003e"}, {"co c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Theorem\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 2. Existence Theorem\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Global Existence of Weak Solutions for Non-Linear Partial Differential Equations\u003cbr\u003e\u003chr\u003e\u003ccode\u003eTheorem 8.1 follows from Lemma 2.6. For any initial velocity u_0 in L^2(R^3), there exists a global weak solution u(t,x) to the Navier-Stokes equations.\u003c/code\u003e"}, {"color": "#ff7f0e", "font": {"color": "#000000"}, "id": "paper_bm06_differential_equations_lemma_lem_001", "label": "Lemma 2.6", "shape": "diamond", "size": 25, "title": "\u003cb\u003eLemma 2.6\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Lemma\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 2. Existence Theorem\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Global Existence of Weak Solutions for Non-Linear Partial Differential Equations\u003cbr\u003e\u003chr\u003e\u003ccode\u003eSobolev embedding H^1(R^3) embedded into L^6(R^3) is continuous.\u003c/code\u003e"}, {"color": "#2ca02c", "font": {"color": "#000000"}, "id": "paper_bm06_differential_equations_corollary_cor_001", "label": "Corollary 8.2", "shape": "box", "size": 22, "title": "\u003cb\u003eCorollary 8.2\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Corollary\u003cbr\u003e\u003ci\u003eSection:\u003c/i\u003e 2. Existence Theorem\u003cbr\u003e\u003ci\u003ePaper:\u003c/i\u003e Global Existence of Weak Solutions for Non-Linear Partial Differential Equations\u003cbr\u003e\u003chr\u003e\u003ccode\u003eBy Theorem 8.1, the energy inequality integral |u(t)|^2 dx \u0026lt;= integral |u_0|^2 dx holds for almost all t.\u003c/code\u003e"}, {"color": "#9467bd", "font": {"color": "#000000"}, "id": "paper_bm06_differential_equations_proof_prf_001", "label": "Proof of Theorem 8.1", "shape": "square", "size": 20, "title": "\u003cb\u003eProof of Theorem 8.1\u003c/b\u003e\u003cbr\u003e\u003ci\u003eType:\u003c/i\u003e Proof\u003c
